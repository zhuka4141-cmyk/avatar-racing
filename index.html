<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>头像赛车</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<section id="setupView">
  <div class="wrap">
    <div class="head">
      <h1>头像赛车<span id="countBadge" class="count">共 0 位参赛者</span></h1>
      <p class="sub">填写姓名并上传头像，点击“开始比赛”即可观看全自动头像赛车。至少需要 2 位参赛者；头像只在当前页面会话中使用，不会上传到任何服务器。</p>
      <p class="ver">构建 v4 · 头像来源：本地 avatars/ → 远程地址 → 默认头像<span id="diag"></span></p>
    </div>
    <div id="searchBar" class="search" hidden>
      <input id="searchInput" type="search" placeholder="搜索姓名 / IG 用户名" autocomplete="off" spellcheck="false" />
      <button id="searchClear" class="btn small ghost" type="button" hidden>清除</button>
      <span id="searchCount" class="search-count"></span>
    </div>
    <div id="list" class="list"></div>
    <div id="empty" class="empty">还没有参赛者，点击下方“添加参赛者”或“填入示例参赛者”开始。</div>
  </div>
  <div class="actions">
    <button id="addBtn" class="btn" type="button">添加参赛者</button>
    <button id="sampleBtn" class="btn ghost" type="button">填入示例参赛者</button>
    <button id="rosterBtn" class="btn ghost" type="button">载入粉丝名单</button>
    <button id="csvBtn" class="btn ghost" type="button">导入 CSV 名单</button>
    <input id="csvInput" type="file" accept=".csv,text/csv,text/plain" hidden />
    <button id="shuffleBtn" class="btn ghost" type="button">随机排序</button>
    <button id="clearBtn" class="btn danger" type="button">清空全部</button>
    <button id="startBtn" class="btn primary" type="button">开始比赛</button>
  </div>
</section>

<section id="raceView" class="race" hidden>
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="hud-panel">
      <div id="hudStatus" class="hud-status">Ready</div>
      <div id="hudSub" class="hud-sub"></div>
    </div>
    <button id="rankBtn" class="hud-btn" type="button" hidden>Standings</button>
  </div>
  <div id="countdown" class="countdown" hidden><i id="countdownText">3</i></div>
  <div id="result" class="result" hidden>
    <div class="result-card">
      <h2>Race finished</h2>
      <div id="resultNote" class="result-note"></div>
      <div id="board" class="board"></div>
      <div class="result-actions">
        <button id="againBtn" class="btn primary" type="button">Race again</button>
        <button id="toSetupBtn" class="btn ghost" type="button">Setup</button>
      </div>
    </div>
  </div>
</section>

<div id="toast" class="toast" hidden></div>

<script src="js/namespace.js"></script>
<script src="js/config.js"></script>
<script src="js/math.js"></script>
<script src="data/roster.js"></script>
<script src="js/participants.js"></script>
<script src="js/track.js"></script>
<script src="js/physics.js"></script>
<script src="js/render.js"></script>
<script src="js/results.js"></script>
<script src="js/debug.js"></script>
<script src="js/setup-ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
